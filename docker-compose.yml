services:
  bot:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/bot.db
    volumes:
      - ./botdata:/data
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # HTTPS для Android-приложения. Сертификат Let's Encrypt выпускается автоматически.
  caddy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - bot

volumes:
  caddy_data:

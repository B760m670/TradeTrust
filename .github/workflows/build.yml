name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TradeTrust-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TradeTrust-apk
          path: android/TradeTrust-${{ github.run_number }}.apk
      # Сборка из main публикуется в Releases — оттуда APK удобно скачать прямо на телефон.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TradeTrust ${{ github.run_number }}
          # первая строка описания показывается в приложении на плашке обновления
          body: ${{ github.event.head_commit.message }}
          files: android/TradeTrust-${{ github.run_number }}.apk
